<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JB Holds | España</title>
    <style>
      :root { --bg: #020611; --cyan: #43dcff; --muted: #8fa7bd; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: var(--muted);
      }
      .center {
        text-align: center;
        padding: 48px 32px;
      }
      .label {
        font-size: 0.74rem;
        font-weight: 760;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--cyan);
        margin-bottom: 20px;
      }
      h1 {
        font-size: clamp(2.8rem, 6vw, 4.8rem);
        font-weight: 860;
        color: #eef8ff;
        line-height: 1;
        margin-bottom: 18px;
      }
      p {
        font-size: 1rem;
        line-height: 1.6;
        max-width: 420px;
        margin: 0 auto 32px;
      }
      a {
        display: inline-block;
        padding: 10px 22px;
        border: 1px solid rgba(67,220,255,0.28);
        border-radius: 8px;
        color: var(--cyan);
        font-size: 0.84rem;
        font-weight: 720;
        text-decoration: none;
        background: rgba(67,220,255,0.06);
        transition: background 200ms;
      }
      a:hover { background: rgba(67,220,255,0.12); }
    </style>
  </head>
  <body>
    <div class="center">
      <p class="label">JB Holds · Corporate Intelligence OS</p>
      <h1>España</h1>
      <p>Panel ejecutivo en construcción. Datos en EUR (€) disponibles próximamente.</p>
      <a href="/">← Volver al inicio</a>
    </div>
  </body>
</html>
